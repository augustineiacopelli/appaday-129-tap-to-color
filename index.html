<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tap to Color</title>
<meta name="description" content="A tap to color book with ten hand drawn scenes. Pick a crayon, tap any region, and your colors save on this device."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;display:flex;flex-direction:column;
  background:#182a38;color:#f2efe7;
  font-family:"Baloo 2",'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:#ffd166;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;background:#132330;border-bottom:2px solid #0d1a24}
.wordmark{font-size:21px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.wordmark span{display:block;font-size:11px;font-weight:600;color:#9fb4c2;letter-spacing:1px}
.bar a{min-height:44px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#152735;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.thumb{flex:0 0 auto;position:relative;width:62px;min-height:66px;border:2px solid #2c4457;
  border-radius:12px;background:#1d3243;color:#cfe0ea;padding:5px 2px 4px;cursor:pointer;
  font:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:2px}
.thumb svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.thumb.on{background:#ffd166;color:#1a2b38;border-color:#ffd166}
.thumb .badge{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;
  background:#5bbf8a;color:#10261c;font-size:12px;font-weight:800;line-height:19px;display:none}
.thumb.done .badge{display:block}
.stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;
  justify-content:center;padding:12px;overflow:auto}
.paper{width:min(100%, max(268px, calc(100dvh - 342px)), 560px);
  background:#fdfbf6;border-radius:18px;padding:8px;box-shadow:0 10px 0 #0e1c26;
  -webkit-user-select:none;user-select:none}
.scene{display:none}
.scene.on{display:block}
.paper svg{display:block;width:100%;height:auto;touch-action:manipulation}
.rg{stroke:#25323b;stroke-width:1.4;stroke-linejoin:round;cursor:pointer}
.dc{fill:none;stroke:#25323b;stroke-width:1.6;stroke-linecap:round}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;background:#152735}
.count{font-size:15px;font-weight:600;color:#cfe0ea}
.count b{color:#ffd166;font-weight:800}
.reset{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #3a5568;
  background:transparent;color:#cfe0ea;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.reset.armed{background:#e2574c;border-color:#e2574c;color:#fff}
.rail{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 14px;background:#132330;
  border-top:2px solid #0d1a24}
.crayon{flex:0 0 auto;width:44px;min-height:56px;padding:0;border:0;background:none;
  cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.crayon svg{width:34px;height:54px;display:block}
.crayon .body{stroke:#0d1a24;stroke-width:2}
.crayon.on{transform:translateY(-7px)}
.crayon.on svg .body{stroke:#ffd166;stroke-width:3.5}
</style>
</head>

<script>
var IMAGES = [{id:"house",name:"House",icon:'<path d="M3 11 L12 4 L21 11"/><path d="M5.5 9.5 V20 H18.5 V9.5"/><path d="M10 20 v-6 h4 v6"/>'},{id:"flower",name:"Flower",icon:'<circle cx="12" cy="10" r="2.6"/><circle cx="12" cy="5" r="2.6"/><circle cx="17" cy="10" r="2.6"/><circle cx="7" cy="10" r="2.6"/><path d="M12 13 v8"/>'},{id:"fish",name:"Fish",icon:'<path d="M3 12 c4-6 10-6 13 0 c-3 6-9 6-13 0 Z"/><path d="M16 12 l5-4 v8 Z"/><circle cx="7" cy="11" r="1"/>'},{id:"cat",name:"Cat",icon:'<circle cx="12" cy="13" r="6"/><path d="M7 9 L6 4 L11 7"/><path d="M17 9 L18 4 L13 7"/><circle cx="10" cy="13" r="1"/><circle cx="14" cy="13" r="1"/>'},{id:"tree",name:"Tree",icon:'<circle cx="12" cy="9" r="6"/><path d="M12 15 v6"/><path d="M8 21 h8"/>'},{id:"star",name:"Star",icon:'<path d="M12 3 L14.6 9.2 L21 9.8 L16.2 14.2 L17.6 21 L12 17.5 L6.4 21 L7.8 14.2 L3 9.8 L9.4 9.2 Z"/>'},{id:"balloon",name:"Balloons",icon:'<ellipse cx="12" cy="9" rx="5.5" ry="7"/><path d="M12 16 v5"/><path d="M10.5 16 h3"/>'},{id:"cupcake",name:"Cupcake",icon:'<path d="M7 11 q5-7 10 0 Z"/><path d="M6 12 h12 l-2 9 H8 Z"/>'},{id:"boat",name:"Sailboat",icon:'<path d="M3 17 h18 l-3 4 H6 Z"/><path d="M12 3 v13"/><path d="M12 5 l6 9 h-6 Z"/>'},{id:"butterfly",name:"Butterfly",icon:'<path d="M12 6 v13"/><ellipse cx="7" cy="9" rx="4.5" ry="4"/><ellipse cx="17" cy="9" rx="4.5" ry="4"/><ellipse cx="8" cy="16" rx="3.5" ry="3"/><ellipse cx="16" cy="16" rx="3.5" ry="3"/>'}];
var PALETTE = [{name:"Coral",hex:"#e2574c"},{name:"Tangerine",hex:"#ef8f3c"},{name:"Sunflower",hex:"#f2c14e"},{name:"Meadow",hex:"#82b74b"},{name:"Pine",hex:"#3f8f72"},{name:"Lagoon",hex:"#3e9bc4"},{name:"Indigo",hex:"#4a63b0"},{name:"Plum",hex:"#8b62b3"},{name:"Bubblegum",hex:"#dd7aa6"},{name:"Cocoa",hex:"#a06a45"},{name:"Slate",hex:"#4b5a63"},{name:"Blank",hex:"#ffffff"}];
var BLANK = '#ffffff';
var KEY_PREFIX = 'coloringbook-';

var state = {};
var totals = {};
var activeColor = '#3e9bc4';
var currentId = IMAGES[0].id;
var resetArmed = false;
var resetTimer = null;

function el(id) { return document.getElementById(id); }

function countFilled(imgId) {
  var m = state[imgId] || {};
  var n = 0;
  for (var k in m) { if (Object.prototype.hasOwnProperty.call(m, k)) { n++; } }
  return n;
}

function save(imgId) {
  try {
    window.localStorage.setItem(KEY_PREFIX + imgId, JSON.stringify(state[imgId] || {}));
  } catch (e) { /* storage unavailable or full */ }
}

function hydrate() {
  for (var i = 0; i < IMAGES.length; i++) {
    var id = IMAGES[i].id;
    var scene = document.querySelector('[data-image-id="' + id + '"]');
    totals[id] = scene ? scene.querySelectorAll('.rg').length : 0;
    state[id] = {};
    var raw = null;
    try { raw = window.localStorage.getItem(KEY_PREFIX + id); } catch (e) { raw = null; }
    if (!raw) { continue; }
    var saved = null;
    try { saved = JSON.parse(raw); } catch (e) { saved = null; }
    if (!saved || typeof saved !== 'object') { continue; }
    for (var rid in saved) {
      if (!Object.prototype.hasOwnProperty.call(saved, rid)) { continue; }
      var shape = scene ? scene.querySelector('#' + rid) : null;
      if (!shape) { continue; }
      shape.setAttribute('fill', saved[rid]);
      state[id][rid] = saved[rid];
    }
  }
}

function refresh() {
  var filled = countFilled(currentId);
  var total = totals[currentId] || 0;
  el('filled').textContent = filled;
  el('total').textContent = total;
  for (var i = 0; i < IMAGES.length; i++) {
    var id = IMAGES[i].id;
    var t = el('thumb-' + id);
    if (!t) { continue; }
    if (totals[id] > 0 && countFilled(id) >= totals[id]) {
      t.classList.add('done');
    } else {
      t.classList.remove('done');
    }
    if (id === currentId) { t.classList.add('on'); } else { t.classList.remove('on'); }
  }
}

function showImage(id) {
  currentId = id;
  for (var i = 0; i < IMAGES.length; i++) {
    var scene = document.querySelector('[data-image-id="' + IMAGES[i].id + '"]');
    if (!scene) { continue; }
    if (IMAGES[i].id === id) { scene.classList.add('on'); } else { scene.classList.remove('on'); }
  }
  disarmReset();
  refresh();
}

function pickColor(hex, btn) {
  activeColor = hex;
  var all = document.querySelectorAll('.crayon');
  for (var i = 0; i < all.length; i++) { all[i].classList.remove('on'); }
  btn.classList.add('on');
  btn.setAttribute('aria-pressed', 'true');
}

function onStageTap(e) {
  var node = e.target;
  while (node && node !== document && node.classList && !node.classList.contains('rg')) {
    node = node.parentNode;
  }
  if (!node || !node.classList || !node.classList.contains('rg')) { return; }
  var rid = node.getAttribute('id');
  if (!rid) { return; }
  if (activeColor === BLANK) {
    node.setAttribute('fill', BLANK);
    if (state[currentId]) { delete state[currentId][rid]; }
  } else {
    node.setAttribute('fill', activeColor);
    if (!state[currentId]) { state[currentId] = {}; }
    state[currentId][rid] = activeColor;
  }
  save(currentId);
  disarmReset();
  refresh();
}

function disarmReset() {
  resetArmed = false;
  if (resetTimer) { window.clearTimeout(resetTimer); resetTimer = null; }
  var b = el('reset');
  b.classList.remove('armed');
  b.textContent = 'Start over';
}

function onReset() {
  var b = el('reset');
  if (!resetArmed) {
    if (countFilled(currentId) === 0) { return; }
    resetArmed = true;
    b.classList.add('armed');
    b.textContent = 'Tap again to clear';
    resetTimer = window.setTimeout(disarmReset, 4000);
    return;
  }
  var scene = document.querySelector('[data-image-id="' + currentId + '"]');
  if (scene) {
    var shapes = scene.querySelectorAll('.rg');
    for (var i = 0; i < shapes.length; i++) { shapes[i].setAttribute('fill', BLANK); }
  }
  state[currentId] = {};
  try { window.localStorage.removeItem(KEY_PREFIX + currentId); } catch (e) { /* ignore */ }
  disarmReset();
  refresh();
}

function buildControls() {
  var rail = el('rail');
  for (var i = 0; i < PALETTE.length; i++) {
    (function (p) {
      var b = document.createElement('button');
      b.className = 'crayon';
      b.type = 'button';
      b.title = p.name;
      b.setAttribute('aria-label', p.name);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<svg viewBox="0 0 34 54" aria-hidden="true">' +
        '<path class="body" fill="' + p.hex + '" d="M17 2 L27 18 L27 50 L7 50 L7 18 Z"/>' +
        '<path class="body" fill="none" d="M7 24 L27 24"/></svg>';
      b.onclick = function () { pickColor(p.hex, b); };
      rail.appendChild(b);
    })(PALETTE[i]);
  }
  var strip = el('strip');
  for (var j = 0; j < IMAGES.length; j++) {
    (function (img) {
      var t = document.createElement('button');
      t.className = 'thumb';
      t.type = 'button';
      t.id = 'thumb-' + img.id;
      t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + img.icon + '</svg>' +
        '<span>' + img.name + '</span><span class="badge">*</span>';
      t.onclick = function () { showImage(img.id); };
      strip.appendChild(t);
    })(IMAGES[j]);
  }
}

function init() {
  buildControls();
  hydrate();
  el('stage').addEventListener('click', onStageTap);
  el('reset').addEventListener('click', onReset);
  var crayons = document.querySelectorAll('.crayon');
  if (crayons.length > 5) { pickColor('#3e9bc4', crayons[5]); }
  showImage(IMAGES[0].id);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
